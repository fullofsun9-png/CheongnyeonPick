.status-link{border:0;text-align:left;width:100%;cursor:pointer;transition:transform .15s,box-shadow .15s}.status-link:active{transform:scale(.98)}.status-link small{display:block;font-size:9px;font-weight:900;color:#2868f5;margin-top:6px}

e:9px;font-weight:900;border-radius:7px;padding:5px 7px;background:#fff4e6;color:#b87517}.diff-pill.same{background:#e8f7f1;color:#15956b}

<body>
<div class="stage">
  <main class="device" aria-label="청년픽 NEXT 시제품">
    <div class="statusbar"><span>9:41  ◉  ◉</span><span>●●●  5G  ▰</span></div>
    <header class="topbar">
      <div class="brand"><span class="brandmark">N</span>청년픽 NEXT</div>
      <div class="header-actions"><button class="iconbtn" title="알림" onclick="toast('새 알림이 없습니다.')">♧</button><button class="iconbtn" title="프로필" onclick="go('profile')">☺</button></div>
    </header>
    <section id="screen" class="scroll" aria-live="polite"></section>
    <nav class="bottomnav" aria-label="하단 메뉴">
      <button class="navitem active" data-nav="home" onclick="go('home')"><span class="navicon">⌂</span><span>홈</span></button>
      <button class="navitem" data-nav="policies" onclick="go('policies')"><span class="navicon">⌕</span><span>정책찾기</span></button>
      <button class="navitem" data-nav="switch" onclick="go('switch')"><span class="navicon">⇄</span><span>생활변화</span></button>
      <button class="navitem" data-nav="apply" onclick="go('apply')"><span class="navicon">☑</span><span>준비관리</span></button>
      <button class="navitem" data-nav="profile" onclick="go('profile')"><span class="navicon">♙</span><span>내 정보</span></button>
    </nav>
    <div id="toast" class="toast"></div>
  </main>
</div>
<script>
const demoProfile={age:'만 23세',address:'경기도',school:'천안 소재 대학 재학',work:'재학 중',interests:['일자리','주거','교육']};
let current='home', selectedCategory='전체', searchTerm='', completed=new Set([0,1]), walletSaved=new Set([2]);
let departureState='current', destinationState='graduateMove';
const policies=[
 {id:1,title:'청년 주거 지원 정책',cat:'주거',state:'check',stateText:'추가 확인',org:'중앙·지자체 정책 예시',reason:'천안 소재 대학 재학 조건은 확인 대상입니다. 주민등록지 요건과 공고 기준일을 함께 확인해야 합니다.',deadline:'공고별 상이'},
 {id:2,title:'청년 취업 지원 프로그램',cat:'일자리',state:'good',stateText:'조건 검토 후보',org:'청년 일자리 정책 예시',reason:'연령과 현재 구직 상태에 따라 적용 여부가 달라질 수 있습니다.',deadline:'모집 일정 확인 필요'},
 {id:3,title:'청년 역량 강화 교육 지원',cat:'교육',state:'check',stateText:'추가 확인',org:'교육·훈련 정책 예시',reason:'재학 여부 및 과거 참여 이력에 대한 확인이 필요합니다.',deadline:'공고별 상이'}
];
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
function go(page){current=page;render();document.getElementById('screen').scrollTop=0;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.nav===(page==='detail'?'policies':page)))}
function card(p){return `<article class="policy-card"><div class="policy-top"><span class="category">${p.org} · ${p.cat}</span><span class="state ${p.state}">${p.stateText}</span></div><h3>${p.title}</h3><p>내 프로필 기준으로 확인할 조건을 정리했어요.</p><div class="reason"><b>나와 관련된 조건</b><br>${p.reason}</div><div class="card-bottom"><small>신청기간: ${p.deadline}</small><button class="arrowbtn" onclick="openDetail(${p.id})">자세히 보기 →</button></div></article>`}
function home(){return `

function downloadTaskFile(i){

 const blob=new Blob(['\ufeff'+item.content],{type:'text/plain;charset=utf-8'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=item.file;document.body.appendChild(a);a.click();a.remove();window.setTimeout(()=>URL.revokeObjectURL(url),1000);

}

}

 <h1 class="page-title">신청 준비 관리</h1><p class="page-sub">체크리스트를 확인하고 관련 안내 파일을 전자지갑에 보관해요.</p>
 <div class="panel"><div class="status-top"><strong>청년 주거 지원 정책 · 시연 데이터</strong><span class="demo-tag">샘플 체크리스트</span></div><div style="display:flex;align-items:end;justify-content:space-between"><div><b style="font-size:25px;color:#1f3152">${done}<span style="font-size:13px;color:#8994a6"> / 5</span></b><div style="font-size:10px;color:#8994a6;margin-top:2px">준비 단계 완료</div></div><b style="color:#2868f5;font-size:12px">${Math.round(done/5*100)}%</b></div><div style="height:7px;background:#edf1f6;border-radius:9px;margin-top:11px;overflow:hidden"><div style="height:100%;width:${done/5*100}%;background:#2868f5;border-radius:9px"></div></div></div>
 ${walletPanel()}
 <div class="panel"><h3>내 준비 체크리스트</h3>${taskList.map((t,i)=>`<div class="task"><input type="checkbox" id="task${i}" ${completed.has(i)?'checked':''} onchange="toggleTask(${i},this.checked)"><label for="task${i}"><strong>${t.title}</strong><small>${t.desc}</small></label><span class="taskstate ${completed.has(i)?'done':(i===2?'progress':'')}">${completed.has(i)?'완료':(i===2?'준비 중':'미완료')}</span></div><div class="task-doc"><span class="file-icon">▤</span><div class="file-meta"><strong>${t.file}</strong><small>${walletSaved.has(i)?'전자지갑에 보관됨':'관련 안내 파일 · TXT'}</small></div><div class="doc-actions"><button class="save-file" onclick="saveToWallet(${i})">${walletSaved.has(i)?'보관됨':'지갑 보관'}</button><button class="download-file" onclick="downloadTaskFile(${i})">받기</button></div></div>`).join('')}</div>
 <div class="panel"><h3>함께 확인할 사항</h3><div class="eligibility"><div><strong>공고별 제출서류</strong><small>시행기관 공고 원문과 대조</small></div><span class="state check">확인 필요</span></div><div class="eligibility"><div><strong>마감 일정</strong><small>공고 변경 시 일정 재확인</small></div><span class="state check">확인 필요</span></div><div class="eligibility"><div><strong>중복수혜 제한</strong><small>다른 지원사업 참여 이력 점검</small></div><span class="state check">확인 필요</span></div></div>
 <button class="primary" onclick="toast('체크리스트 상태를 이 화면에 반영했어요.')">준비 현황 저장</button>
 <div class="info-note"><span>ⓘ</span><span>다운로드 파일은 시연용 안내·점검 양식이며 실제 증명서, 공식 공고문 또는 신청서가 아닙니다. 개인 증빙서류의 업로드·암호화 보관·기관 제출 연동은 아직 구현하지 않았습니다.</span></div>`}
function profilePage(){return `
 <h1 class="page-title">내 프로필</h1><p class="page-sub">정책 자격 검토에 필요한 최소 정보만 구분해서 입력해요.</p>
 <div class="panel"><h3>기본 정보</h3><label class="fieldlabel">연령</label><input class="field" value="만 23세"/><label class="fieldlabel">주민등록상 주소지</label><input class="field" value="경기도"/><label class="fieldlabel">학교 소재지</label><input class="field" value="천안시"/><label class="fieldlabel">현재 상태</label><select class="field"><option>대학 재학</option><option>졸업</option><option>구직 중</option><option>재직 중</option><option>창업</option></select></div>
 <div class="panel"><h3>관심 분야</h3><div class="chips"><button class="chip active" onclick="this.classList.toggle('active')">일자리</button><button class="chip active" onclick="this.classList.toggle('active')">주거</button><button class="chip active" onclick="this.classList.toggle('active')">교육</button><button class="chip" onclick="this.classList.toggle('active')">창업</button></div></div>
 <div class="info-note"><span>ⓘ</span><span>거주지와 학교·근무 지역을 별도 항목으로 관리합니다. 소득·재산 정보는 자동으로 확정하지 않고, 필요한 경우 추가 확인 항목으로 다룹니다.</span></div>
 <button class="primary" onclick="toast('프로필 입력 예시를 확인했습니다.')">입력 정보 확인</button>`}
function toggleTask(i,checked){if(checked)completed.add(i);else completed.delete(i);render()}
function render(){const screen=document.getElementById('screen');const pages={home,policies:policiesPage,detail,switch:switchPage,apply:applyPage,profile:profilePage};screen.innerHTML=(pages[current]||home)();document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.nav===(current==='detail'?'policies':current)));}
render();
</script>
</body>
</html>
